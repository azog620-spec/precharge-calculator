<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="預充電計算">
<title>電容預充電計算器</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--border:#2c2c2e;--text:#fff;--sub:#8e8e93;--blue:#0a84ff;--danger:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{width:100%;max-width:430px;margin:auto}
header{text-align:center;margin-bottom:22px}h1{font-size:22px;margin:0 0 5px;font-weight:700}.subtitle{font-size:13px;color:var(--sub);margin:0}
.card,.results{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:16px}
.card{padding:6px 16px}.field{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.field:last-child{border-bottom:0}
label{font-size:16px;font-weight:500}.input-wrap{display:flex;align-items:center;gap:6px}input{background:transparent;border:0;outline:0;color:#fff;font-size:17px;font-weight:600;text-align:right;width:110px;-moz-appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none}.unit{color:var(--sub);font-size:14px;width:30px}
.presets{display:flex;gap:7px;margin-bottom:16px}.preset{flex:1;padding:9px 0;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:#fff;text-align:center}.preset:active{background:var(--border)}
.actions{display:flex;gap:10px;margin-bottom:20px}button{cursor:pointer} .secondary,.primary{padding:14px;border-radius:12px;font-size:16px}.secondary{flex:1;background:var(--card);color:var(--sub);border:1px solid var(--border)}.primary{flex:2;background:var(--blue);color:#fff;border:0;font-weight:600}
.results{padding:16px;display:none}.result-title{font-size:13px;letter-spacing:.5px;color:var(--sub);margin-bottom:8px}.row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border);font-size:15px}.row:last-child{border:0}.val{font-size:17px;font-weight:700;color:var(--blue);text-align:right}
.note{font-size:11px;color:var(--sub);line-height:1.5;margin:12px 3px 0}
</style>
</head>
<body>
<div class="container">
<header><h1>電容預充電計算器</h1><p class="subtitle">RC Pre-charge Calculator</p></header>

<div class="card">
<div class="field"><label>電容容量</label><div class="input-wrap"><input id="cap" type="number" inputmode="decimal" value="3100"><span class="unit">μF</span></div></div>
<div class="field"><label>預充電阻</label><div class="input-wrap"><input id="res" type="number" inputmode="decimal" value="50"><span class="unit">Ω</span></div></div>
<div class="field"><label>系統電壓</label><div class="input-wrap"><input id="volt" type="number" inputmode="decimal" value="58"><span class="unit">V</span></div></div>
<div class="field"><label>目標比例</label><div class="input-wrap"><input id="target" type="number" inputmode="decimal" value="95"><span class="unit">%</span></div></div>
</div>

<div class="presets">
<div class="preset" onclick="setTarget(80)">80%</div>
<div class="preset" onclick="setTarget(90)">90%</div>
<div class="preset" onclick="setTarget(95)">95%</div>
<div class="preset" onclick="setTarget(99)">99%</div>
</div>

<div class="actions">
<button class="secondary" onclick="resetForm()">重設</button>
<button class="primary" onclick="calculate()">開始計算</button>
</div>

<div class="results" id="results">
<div class="result-title">計算結果</div>
<div class="row"><span>RC 常數 τ</span><span class="val" id="tau">-</span></div>
<div class="row"><span>到達電壓</span><span class="val" id="reach">-</span></div>
<div class="row"><span>所需時間</span><span class="val" id="time">-</span></div>
<div class="row"><span>初始峰值電流</span><span class="val" id="ipeak">-</span></div>
<div class="row"><span>初始峰值功率</span><span class="val" id="ppeak">-</span></div>
<div class="row"><span>電容儲能</span><span class="val" id="energy">-</span></div>
</div>
<p class="note">模型：V<sub>C</sub>=V(1−e<sup>−t/RC</sup>)。初始峰值電流與功率為 t=0 時的理論值；實際電路仍會受 MOSFET、線阻、ESR、接觸器及電阻脈衝功率能力影響。</p>
</div>

<script>
function n(id){return parseFloat(document.getElementById(id).value)}
function setTarget(v){document.getElementById('target').value=v;calculate()}
function resetForm(){
document.getElementById('cap').value=3100;
document.getElementById('res').value=50;
document.getElementById('volt').value=58;
document.getElementById('target').value=95;
document.getElementById('results').style.display='none'
}
function calculate(){
const cap=n('cap'), r=n('res'), v=n('volt'), pct=n('target');
if(!Number.isFinite(cap)||cap<=0||!Number.isFinite(r)||r<=0||!Number.isFinite(v)||v<=0||!Number.isFinite(pct)||pct<=0||pct>=100){
alert('請確認電容、電阻、電壓及目標比例皆為有效數值。');return;
}
const c=cap*1e-6, p=pct/100, tau=r*c, t=-tau*Math.log(1-p);
document.getElementById('tau').textContent=(tau*1000).toFixed(1)+' ms';
document.getElementById('reach').textContent=(v*p).toFixed(2)+' V';
document.getElementById('time').textContent=(t*1000).toFixed(1)+' ms ('+t.toFixed(4)+' s)';
document.getElementById('ipeak').textContent=(v/r).toFixed(2)+' A';
document.getElementById('ppeak').textContent=(v*v/r).toFixed(2)+' W';
document.getElementById('energy').textContent=(0.5*c*v*v).toFixed(3)+' J';
document.getElementById('results').style.display='block';
}
window.addEventListener('load',calculate);
</script>
</body>
</html>
